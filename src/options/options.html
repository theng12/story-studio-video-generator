<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Story Studio Video Generator — Settings</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.45 system-ui,sans-serif; background:#0d1117; color:#e6edf3 }
      body { max-width:760px; margin:0 auto; padding:24px }
      h1 { font-size:22px }
      section { margin:14px 0; padding:16px; border:1px solid #30363d; border-radius:10px; background:#161b22 }
      label { display:flex; flex-direction:column; gap:5px; margin:10px 0 }
      input,select,button { padding:8px 10px; border:1px solid #3d444d; border-radius:7px; background:#21262d; color:inherit }
      button { cursor:pointer; background:#1f6feb; border-color:#1f6feb; font-weight:600 }
      .row { display:flex; gap:10px; align-items:end }
      .row label { flex:1 }
      .hint,#status { color:#8b949e }
    </style>
  </head>
  <body>
    <h1>Story Studio Video Generator — Settings</h1>
    <section>
      <strong>Story Studio</strong>
      <label>Server URL <input id="studioBaseUrl" type="url" /></label>
      <div class="row">
        <label>Username <input id="studioUsername" autocomplete="username" /></label>
        <label>Password <input id="studioPassword" type="password" autocomplete="current-password" /></label>
        <button id="login">Sign in</button>
      </div>
    </section>
    <section>
      <strong>Flow and video</strong>
      <label>Flow project ID <input id="flowProjectId" /></label>
      <div class="row">
        <label>Video model
          <select id="videoModel">
            <option value="omni-flash">Omni Flash</option>
            <option value="veo-3.1-lite">Veo 3.1 Lite</option>
            <option value="veo-3.1-fast">Veo 3.1 Fast</option>
            <option value="veo-3.1-quality">Veo 3.1 Quality</option>
          </select>
        </label>
        <label>Start image
          <select id="videoSource">
            <option value="existing">Existing scene image</option>
            <option value="generate">Generate fresh first</option>
          </select>
        </label>
        <label>Aspect ratio
          <select id="aspectRatio"><option>16:9</option><option>9:16</option></select>
        </label>
      </div>
    </section>
    <section>
      <strong>Saving and pacing</strong>
      <label>Default save target
        <select id="saveTarget">
          <option value="project">Story Studio “11 Video Assets”</option>
          <option value="download">Downloads</option>
        </select>
      </label>
      <label>Downloads subfolder <input id="downloadSubdir" /></label>
      <label>Filename template <input id="filenameTemplate" /></label>
      <div class="row">
        <label>Minimum delay (seconds) <input id="humanDelayMinSec" type="number" min="0" max="3600" /></label>
        <label>Maximum delay (seconds) <input id="humanDelayMaxSec" type="number" min="0" max="3600" /></label>
      </div>
      <div class="hint">Tokens: {project}, {episodeCode}, {episodeTitle}, {sceneId}, {sceneIndex}</div>
    </section>
    <button id="save">Save settings</button>
    <div id="status"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
