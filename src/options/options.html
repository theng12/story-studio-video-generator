<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Story Studio Video Generator — Settings</title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <link rel="stylesheet" href="options.css" />
    <style>
      body { width: 100%; max-width: none; padding: 24px 16px; }
      .settings-wrap { width: 100%; max-width: 480px; margin: 0 auto; }
      .settings-wrap > header { margin-bottom: 14px; }
      .settings-wrap > header h1 { font-size: 16px; }
      .settings-section { margin-top: 12px; }
      .settings-section .row { align-items: end; }
      .settings-section .row label { flex: 1; }
      .settings-section .row button { flex: none; margin-bottom: 0; }
      .settings-footer { justify-content: space-between; margin-top: 14px; }
      .settings-footer .primary { width: auto; min-width: 92px; margin: 0; }
      .hint { margin: 7px 0 0; color: var(--muted); font-size: 11px; }
      @media (max-width: 420px) {
        .settings-section .row { align-items: stretch; flex-direction: column; }
        .settings-section .row button { width: 100%; }
      }
    </style>
    <script src="../lib/theme-preload.js"></script>
  </head>
  <body class="settings-page">
    <div class="settings-wrap">
      <header class="settings-header"><h1>Story Studio Video Generator — Settings</h1></header>

      <section class="settings-section">
        <span class="settings-section-title">Appearance</span>
        <label>Theme
          <select id="theme">
            <option value="system">System (match OS)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </section>

      <section class="settings-section">
        <span class="settings-section-title">Mode</span>
        <label>Provider
          <select id="mode">
            <option value="standalone">Standalone</option>
            <option value="gateway">Gateway Studio</option>
          </select>
        </label>
      </section>

      <section class="settings-section" id="gatewaySection">
        <span class="settings-section-title">Gateway Studio</span>
        <label>Gateway address
          <input id="gatewayUrl" type="url" placeholder="http://127.0.0.1:8787" />
        </label>
        <label>Worker ID
          <input id="gatewayWorkerId" maxlength="160" placeholder="Assigned on first claim" />
        </label>
        <label>Worker token
          <input id="gatewayToken" type="password" autocomplete="off" placeholder="Bearer token" />
        </label>
      </section>

      <section class="settings-section">
        <span class="settings-section-title">Flow request ids (advanced)</span>
        <p class="hint">Resolved from the live page each time; these are only the fallback used when discovery cannot identify one. A Flow change is fixed here, without reinstalling.</p>
        <label>Generate image<input id="rpcIdGenerateImage" autocomplete="off" spellcheck="false" maxlength="32" /></label>
        <label>Upload image<input id="rpcIdUploadImage" autocomplete="off" spellcheck="false" maxlength="32" /></label>
        <label>Text to video<input id="rpcIdTextToVideo" autocomplete="off" spellcheck="false" maxlength="32" /></label>
        <label>Image to video<input id="rpcIdImageToVideo" autocomplete="off" spellcheck="false" maxlength="32" /></label>
        <label>Check video<input id="rpcIdCheckVideo" autocomplete="off" spellcheck="false" maxlength="32" /></label>
        <label>Get media<input id="rpcIdGetMedia" autocomplete="off" spellcheck="false" maxlength="32" /></label>
        <label>Credits<input id="rpcIdCredits" autocomplete="off" spellcheck="false" maxlength="32" /></label>
      </section>

      <div class="row settings-footer">
        <span id="status" class="muted small" aria-live="polite"></span>
        <button id="save" class="primary">Save</button>
      </div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
